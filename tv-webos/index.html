<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CouchSubs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="video-host"></div>

  <div id="subtitle" class="hidden"><div id="subtitle-prev" class="hidden"><span id="subtitle-prev-text"></span></div><span id="subtitle-text"></span></div>

  <div id="waiting" class="hidden">
    <div class="waiting-title" data-i18n="waiting"></div>
    <div class="waiting-hint" data-i18n="waitingHint"></div>
  </div>

  <div id="panel">
    <div class="title" data-i18n="panelTitle"></div>
    <div><b data-i18n="hdmi"></b>: <span id="st-hdmi">-</span> <span id="st-video" class="muted"></span></div>
    <div><b data-i18n="server"></b>: <span id="st-server">-</span></div>
    <div><b data-i18n="connection"></b>: <span id="st-conn">-</span></div>
    <div class="keys" data-i18n="keys"></div>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
