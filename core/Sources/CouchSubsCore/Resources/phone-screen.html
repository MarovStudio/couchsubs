<!-- CouchSubs telefon ekranı: TV olmayan kurulumlarda (ör. monitor) tərcümə telefonun brauzerində göstərilir.
     Bilgisayar bu səhifəni /telefon ünvanından verir. Telefon yan (üfüqi) tutulur.
     Parametrlər: ?size=9 (yazı boyu, ekran hündürlüyünün %-i), ?history=1 (əvvəlki cümlə də görünsün, 0/1). -->
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CouchSubs</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 3vh 5vw; box-sizing: border-box; text-align: center; }
  #prev { font-size: 5.5vh; line-height: 1.3; color: #8a8a8a; margin-bottom: 2.5vh; white-space: pre-line; min-height: 0; }
  #line { font-size: 9vh; line-height: 1.3; font-weight: 650; white-space: pre-line; transition: opacity 0.15s; }
  #line.off { opacity: 0.35; }
  #status { position: absolute; left: 0; right: 0; bottom: 1.5vh; font-size: 3vh; color: #666; text-align: center; }
  #status.bad { color: #e5534b; }
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000;
    font-size: 6vh; color: #ddd; text-align: center; padding: 0 8vw; cursor: pointer; }
  #start b { color: #fff; display: block; font-size: 8vh; margin-bottom: 2vh; }
  @media (orientation: portrait) { #line { font-size: 5vh; } #prev { font-size: 3.2vh; } }
</style>
</head>
<body>
<div id="wrap"><div id="prev"></div><div id="line"></div></div>
<div id="status">Qoşulur…</div>
<div id="start"><div><b>CouchSubs</b>Başlamaq üçün toxun (ekran tam açılır və sönmür)</div></div>
<script>
(function () {
  var line = document.getElementById('line');
  var prev = document.getElementById('prev');
  var status = document.getElementById('status');
  var params = new URLSearchParams(location.search);
  var size = Number(params.get('size'));
  var history = params.get('history') !== '0';
  if (size > 0) { line.style.fontSize = size + 'vh'; prev.style.fontSize = (size * 0.6) + 'vh'; }
  var timer = null, current = '', wakeLock = null;

  function setStatus(text, bad) { status.textContent = text; status.className = bad ? 'bad' : ''; }

  // Ekran sönməsin: Wake Lock API (Chrome/Safari yeni versiyalar). Səhifə gizlənib qayıdanda yenidən istənir.
  function keepAwake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (lock) { wakeLock = lock; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });

  document.getElementById('start').addEventListener('click', function () {
    this.style.display = 'none';
    var root = document.documentElement;
    try { (root.requestFullscreen || root.webkitRequestFullscreen || function () {}).call(root); } catch (e) {}
    try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
    keepAwake();
  });

  function show(text, duration) {
    clearTimeout(timer);
    if (!text) return;
    if (history && current && current !== text) prev.textContent = current;
    current = text;
    line.textContent = text;
    line.className = '';
    // Mətn ekrandan itmir, sadəcə vaxtı keçəndə solğunlaşır: oxumağa çatmasan da görürsən.
    timer = setTimeout(function () { line.className = 'off'; }, Math.max(1500, duration || 8000));
  }

  function clearLine() { clearTimeout(timer); line.className = 'off'; }

  function connect() {
    if (!window.EventSource) { setStatus('Bu brauzer dəstəklənmir (EventSource yoxdur)', true); return; }
    var events = new EventSource('/events');
    events.onopen = function () { setStatus('Qoşuldu · altyazı gözlənilir'); };
    events.onerror = function () { setStatus('Kompüterlə əlaqə yoxdur — yenidən qoşulur…', true); };
    events.addEventListener('subtitle', function (e) {
      try { var d = JSON.parse(e.data); show(d.text, d.duration); setStatus('Qoşuldu'); } catch (err) {}
    });
    events.addEventListener('clear', clearLine);
  }
  connect();
})();
</script>
</body>
</html>
