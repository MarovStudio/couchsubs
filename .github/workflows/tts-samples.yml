# Türkçe dublaj denemesi: CouchSubs'ın dublaj kodu (CouchSubsCore) gerçek pocket-tts (Kyutai, MIT) ve Pocket TTS Turkish
# (wite-tech, CC-BY-4.0) ile altı sesi seslendirir; ham ve "akıcı" (duraklamaları kısaltılmış) sesleri ve süreleri yazar.
# Elle çalıştırılır.
name: tts-samples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: pocket-tts programı
        run: ./scripts/fetch-pocket-tts.sh mac

      - name: Model
        run: |
          python3 - <<'EOF'
          import re, subprocess
          src = open('core/Sources/CouchSubsCore/Dubbing/DubbingModel.swift').read()
          rev = re.search(r'revision = "([0-9a-f]+)"', src).group(1)
          for name, sha in re.findall(r'File\(name: "([^"]+)", bytes: [\d_]+, sha256: "([0-9a-f]+)"\)', src):
              url = f'https://huggingface.co/wite-tech/pocket-tts-turkish/resolve/{rev}/{name}'
              subprocess.run(['curl', '-sfL', '--create-dirs', '-o', f'model/{name}', url], check=True)
              out = subprocess.run(['shasum', '-a', '256', f'model/{name}'], capture_output=True, text=True, check=True).stdout
              assert out.split()[0] == sha, name
          print('model hazır')
          EOF

      - name: Seslendir
        working-directory: core
        env:
          COUCHSUBS_TTS_BIN: ${{ github.workspace }}/dist/tts/pocket-tts
          COUCHSUBS_TTS_MODEL: ${{ github.workspace }}/model
          COUCHSUBS_TTS_OUT: ${{ github.workspace }}/out
        run: swift test --filter PocketTTSIntegrationTests

      - uses: actions/upload-artifact@v4
        with:
          name: tts-samples
          path: out
